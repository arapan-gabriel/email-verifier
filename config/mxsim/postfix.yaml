# Friendly corporate MX with generous limits. Baseline for "the validator
# works at all" tests and for latency comparisons.
name: postfix
domains: [corp-sim.test, postfix-sim.test]
listen: ["127.0.0.1:2529"]
banner: "220 mail.corp-sim.test ESMTP Postfix (mxsim)"
ehlo_caps: [PIPELINING, "SIZE 10240000", VRFY, ETRN, 8BITMIME, DSN]

limits:
  max_concurrent_conns: 20
  conn_rate:
    count: 600
    window: 60s
  rcpt_rate:
    count: 600
    window: 60s
  rcpt_per_conn: 100
  cooldown_after_exceed: 30s

behaviour:
  catch_all: false
  accept: "250 2.1.5 Ok"
  reject_unknown: "550 5.1.1 <%s>: Recipient address rejected: User unknown in local recipient table"

recipients:
  exists: [valid@, gabriel@, hr@, sales@, ceo@]
  bounce: [nope@, former.employee@]
  timeout: [blackhole@]
  drop: [reset@]

chaos:
  temp_error_rate: 0.0
  drop_rate: 0.0
  seed: 11
