# Example configuration. Every value may be overridden by VERIFIERD_* env vars;
# secrets belong in the systemd EnvironmentFile, never here (invariant 10).

http:
  addr: "127.0.0.1:8080"
  read_timeout: 10s
  write_timeout: 60s
  idle_timeout: 60s
  shutdown_timeout: 30s

# The integration boundary is mTLS (ADR-006). Leaving these empty serves plain
# HTTP, which is for local development only — the host is on a public IP with
# :25 open and is scanned continuously.
tls:
  cert_file: ""        # /etc/verifierd/tls/server.pem
  key_file: ""         # /etc/verifierd/tls/server.key
  client_ca_file: ""   # /etc/verifierd/tls/client-ca.pem — set this for mTLS

redis:
  # "unix:/path" or "host:port". The socket keeps Redis off the network entirely.
  addr: "unix:/run/redis/redis-server.sock"
  dial_timeout: 2s

probe:
  # Must FCrDNS to source_ip, or Yahoo/Apple/GMX/Microsoft reject the session
  # with a 5.7.x before RCPT is ever considered.
  helo: "mail.datascoutmail.com"
  # Need not FCrDNS — which is what lets verification use a sub-domain isolated
  # from the domain that sends real mail (ARCHITECTURE §"Sender identity").
  mail_from: "verify@probe.datascoutmail.com"
  # Travels with every answer: a verdict is only as good as the IP behind it.
  source_ip: "92.222.87.97"
  # Invariant 3. Anything but tcp4 is refused at startup: a bare "tcp" on this
  # dual-stack host prefers IPv6 and leaves from an address with no FCrDNS and
  # no SPF, and every result would silently become unusable.
  dial_network: "tcp4"
  # 25 in production; overridable so a staging instance can aim at a lab MX.
  port: "25"
  timeout: 20s
  # An unbounded recipient list is itself a harvesting signal, and servers
  # commonly cap it near 100.
  max_rcpt_per_session: 50
  max_emails_per_request: 500

auth:
  enabled: true
  # api_key: set via VERIFIERD_AUTH_API_KEY, never in this file.

log:
  level: info
  format: json
