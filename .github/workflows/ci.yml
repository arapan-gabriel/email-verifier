name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    # The central bucket (invariant 4) runs against a real Redis here, not only
    # against the Go model of its Lua (plan 027). Locally those tests skip
    # unless VERIFIERD_TEST_REDIS_ADDR is set; in CI it always is.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true

      # These are the Phase-4 gate from CLAUDE.md, in order and verbatim.
      - name: go test -race
        env:
          VERIFIERD_TEST_REDIS_ADDR: 127.0.0.1:6379
        run: go test -race -count=1 ./...

      # The real-Redis tests skip without the variable, and a skip is silent in
      # the step above. This makes "they ran" visible in the log, and fails if
      # any of them skipped (plan 027 Definition of Done).
      - name: real-Redis tests ran
        env:
          VERIFIERD_TEST_REDIS_ADDR: 127.0.0.1:6379
        run: |
          out="$(go test -count=1 -v -run 'Real|FakeAgrees' ./internal/limiter/ ./internal/pacer/)"
          echo "$out" | grep -E '^(=== RUN|--- (PASS|FAIL|SKIP)|ok|FAIL)'
          if echo "$out" | grep -q -- '--- SKIP'; then echo "a real-Redis test skipped in CI"; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Pinned, not `latest`: an upstream release adding a check turns main
          # red with no change of ours, and the version CI runs should be the
          # version the Phase-4 gate runs locally. Bump it deliberately.
          version: v2.13.2

      # Per-package coverage against scripts/coverage-floors.txt (plan 027). A
      # second run, without -race: instrumented race builds are slower, and
      # keeping the two apart lets either be rerun alone.
      - name: coverage
        env:
          VERIFIERD_TEST_REDIS_ADDR: 127.0.0.1:6379
        run: scripts/coverage-gate.sh

  binary:
    runs-on: ubuntu-latest
    needs: gate
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true

      - name: static build
        run: CGO_ENABLED=0 go build -trimpath -ldflags '-s -w' -o bin/verifierd ./cmd/verifierd

      # ADR-005: the binary is the release artifact, there is no image.
      - name: assert statically linked
        run: |
          file bin/verifierd
          if ldd bin/verifierd 2>&1 | grep -qv 'not a dynamic executable'; then
            echo "binary is dynamically linked"; exit 1
          fi

      # The bundle, not a bare executable (plan 016). Everything the node runs
      # that lives in this repository ships together, so a fix cannot reach the
      # binary while missing the thing that gates it.
      #
      # preflight.sh is the ExecStartPre start gate — plan 013 found three bugs
      # in it, and a corrected gate that never reaches the node is a gate that
      # keeps lying. verifierd.yaml ships verbatim: the host's own values live
      # in its EnvironmentFile, so the installed config stays byte-identical to
      # this one and a key added here is not silently missing there.
      - name: assemble the release bundle
        run: |
          mkdir -p release
          cp bin/verifierd                   release/verifierd
          cp packaging/verifierd.service     release/verifierd.service
          cp scripts/preflight.sh            release/preflight.sh
          # scripts/verifierd-deploy is deliberately NOT here. The staging
          # directory is writable by the `deploy` user, so a bundle that
          # carried the privileged script — and a deploy that installed it —
          # would let `deploy` put arbitrary code where root runs it, which is
          # exactly what the one-line sudoers entry exists to prevent. Updating
          # it on the node is a manual, root action.
          cp config/verifierd.yaml           release/verifierd.yaml
          cd release && sha256sum verifierd verifierd.service preflight.sh verifierd.yaml > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: verifierd-release
          path: release/
