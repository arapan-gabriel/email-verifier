name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      # These four are the Phase-4 gate from CLAUDE.md, in order and verbatim.
      - name: go test -race
        run: go test -race -count=1 ./...

      - name: go vet
        run: go vet ./...

      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  binary:
    runs-on: ubuntu-latest
    needs: gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: static build
        run: CGO_ENABLED=0 go build -trimpath -ldflags '-s -w' -o bin/verifierd ./cmd/verifierd

      # ADR-005: the binary is the release artifact, there is no image.
      - name: assert statically linked
        run: |
          file bin/verifierd
          if ldd bin/verifierd 2>&1 | grep -qv 'not a dynamic executable'; then
            echo "binary is dynamically linked"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: verifierd
          path: bin/verifierd
